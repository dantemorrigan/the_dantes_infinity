plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"infinity_gauntlet" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Client game tests (visual checks with screenshots): ./gradlew runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "infinity_gauntlet_gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}


// A focused real-client regression run, without replaying every unrelated cinematic suite.
// ./gradlew runClientGameTest -PcosmosTest (Linux headless: prefix with xvfb-run -a).
def onlyCosmosTests = providers.gradleProperty('cosmosTest').isPresent()
// ./gradlew runClientGameTest -PonlyTest=MindSoulTest — run a single client game test class.
def onlyTest = providers.gradleProperty('onlyTest').getOrNull()
tasks.named('processGametestResources') {
    inputs.property('cosmosTest', onlyCosmosTests)
    inputs.property('onlyTest', onlyTest ?: '')
    doLast {
        if (onlyCosmosTests) {
            def metadata = new File(destinationDir, 'fabric.mod.json')
            def data = new groovy.json.JsonSlurper().parse(metadata)
            data.entrypoints['fabric-client-gametest'] = ['com.dantemorrigan.gauntlet.gametest.CosmosTravelTest', 'com.dantemorrigan.gauntlet.gametest.SupersonicFlightTest']
            metadata.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
        }
        if (onlyTest != null) {
            def metadata = new File(destinationDir, 'fabric.mod.json')
            def data = new groovy.json.JsonSlurper().parse(metadata)
            data.entrypoints['fabric-client-gametest'] = ['com.dantemorrigan.gauntlet.gametest.' + onlyTest]
            metadata.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
        }
    }
}

// Keep the offline development identity stable between launches; Minecraft otherwise chooses Player###.
// The default retains the profile from the existing test save. Override for a second local client.
loom.runs.named('client') {
    programArguments.addAll('--username', providers.gradleProperty('devUsername').getOrElse('Player433'))
}
// Game tests inherit the client configuration but keep their own deterministic Player0 identity.
loom.runs.named('clientGameTest') {
    def inherited = new ArrayList(programArguments.get())
    def cleaned = []
    def testName = 'Player0'
    for (int i = 0; i < inherited.size(); i++) {
        if (inherited[i] == '--username' && i + 1 < inherited.size()) testName = inherited[++i]
        else cleaned.add(inherited[i])
    }
    cleaned.addAll(['--username', testName])
    programArguments.set(cleaned)
}
