# The heavy client game tests (software-rendered Minecraft under xvfb). Run by hand when needed:
# Actions -> regression -> Run workflow.

name: regression
on:
  workflow_dispatch:

concurrency:
  group: regression
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: ability wheel client regression
        timeout-minutes: 12
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a ./gradlew runClientGameTest -PonlyTest=AbilityWheelTest
      - name: Infinity Snap client regression
        timeout-minutes: 8
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: xvfb-run -a ./gradlew runClientGameTest -PonlyTest=SnapTest
      - name: Living Tribunal client regression
        timeout-minutes: 10
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a ./gradlew runClientGameTest -PonlyTest=TribunalTest
      - name: Cosmic Tribunal and routes client regression
        timeout-minutes: 10
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a ./gradlew runClientGameTest -PonlyTest=TribunalCosmicTest
      - name: Latveria and Doom release regression
        timeout-minutes: 15
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a ./gradlew runClientGameTest -PonlyTest=DoomReleaseTest
      - name: cosmos screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Ability-wheel-regression
          path: |
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/logs/
            run/logs/
