# Run the Doom release scenario when its server code or test changes.
# Run the full client regression manually from Actions -> regression.

name: regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/regression.yml
      - src/main/java/com/dantemorrigan/gauntlet/doom/**
      - src/main/java/com/dantemorrigan/gauntlet/boss/ThanosEncounter.java
      - src/gametest/java/com/dantemorrigan/gauntlet/gametest/DoomReleaseTest.java

concurrency:
  group: regression
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: ability wheel client regression
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 12
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a ./gradlew runClientGameTest -PonlyTest=AbilityWheelTest
      - name: Infinity Snap client regression
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 8
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: xvfb-run -a ./gradlew runClientGameTest -PonlyTest=SnapTest
      - name: Living Tribunal client regression
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 10
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a ./gradlew runClientGameTest -PonlyTest=TribunalTest
      - name: Cosmic Tribunal and routes client regression
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 10
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a ./gradlew runClientGameTest -PonlyTest=TribunalCosmicTest
      - name: Latveria and Doom release regression
        timeout-minutes: 15
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a ./gradlew runClientGameTest -PonlyTest=DoomReleaseTest
      - name: cosmos screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Ability-wheel-regression
          path: |
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/logs/
            run/logs/
