# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
# Cheap on purpose (the account's free Actions minutes are limited): only pushes to main and pull requests build, a newer
# push cancels the build still running, and the heavy client regression tests live in the manual `regression` workflow.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build compileGametestJava
      - name: check planet fracture geometry
        run: java -cp build/classes/java/client src/geometryTest/java/PlanetGeometryCheck.java
      - name: check cosmos navigation
        run: java -cp build/classes/java/main src/geometryTest/java/CosmosRoutesCheck.java
      - name: check giant planetary clearance
        run: java -cp build/classes/java/main src/geometryTest/java/TribunalSpaceCheck.java
      - name: validate cosmos textures
        run: python3 scripts/check_cosmos_assets.py
      - name: validate Tribunal mesh
        run: python3 scripts/check_tribunal_mesh.py
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

