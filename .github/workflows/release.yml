# Builds the mod and publishes a GitHub release with the jar for the version in gradle.properties.
# Start it by hand (Actions -> release -> Run workflow, on main) or by pushing the tag vX.Y.Z.
# The release text is docs/releases/vX.Y.Z.md; a run started by hand creates the tag on the commit it built.

name: release
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: check the tag against the mod version
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in gradle.properties" >&2
            exit 1
          fi
          test -f "docs/releases/$tag.md" || { echo "docs/releases/$tag.md is missing" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: build
        run: |
          chmod +x ./gradlew
          ./gradlew build
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "build/libs/infinity_gauntlet-$VERSION.jar" \
            --title "$TAG" --notes-file "docs/releases/$TAG.md" --target "$GITHUB_SHA"
